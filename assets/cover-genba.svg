  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="690" cy="70" r="150" fill="#ffffff" opacity="0.04"/>
  <circle cx="90" cy="450" r="120" fill="#ffffff" opacity="0.03"/>

